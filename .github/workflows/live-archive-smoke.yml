name: Public GitHub PDF file smoke

on:
  push:
    branches:
      - verify/live-pdf-smoke-20261010

jobs:
  github-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check out candidate importer
        run: |
          git fetch origin main
          git checkout --detach FETCH_HEAD
      - run: python -m pip install -r requirements-archive.txt
      - name: Download and extract real externally archived decision PDF
        run: |
          python - <<'PY'
          from io import BytesIO
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader
          url="https://raw.githubusercontent.com/xrenxf/Dataset-Kasasi-Perdata-Kasus-Perbuatan-Melawan-Hukum-Tahun-2023-2024/main/Putusan%20Pengadilan/putusan_1007_k_pdt_2023_20241025022057.pdf"
          r=requests.get(url,timeout=25)
          print("url:",url)
          print("HTTP:",r.status_code,"type:",r.headers.get("Content-Type"),"bytes:",len(r.content))
          r.raise_for_status()
          assert r.content[:8].startswith(b"%PDF-")
          from pathlib import Path
          Path('real-test.pdf').write_bytes(r.content)
          reader=PdfReader(BytesIO(r.content))
          assert len(reader.pages) >= 1
          txt=reader.pages[0].extract_text() or ""
          print("REAL PDF VERIFIED pages:",len(reader.pages),"page1 text chars:",len(txt))
          assert len(txt.strip()) >= 10
          PY
      - name: Run our production importer on retrieved real PDF
        run: |
          python -m rulings.import_corpus real-test.pdf --output smoke-real --source github-research-archive --text
          python -m rulings.archive stats --output smoke-real
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          r=Path('smoke-real')
          with sqlite3.connect(r/'index.sqlite3') as db:
            status,pdf_path,txt_path,chars,pages=db.execute('SELECT status,pdf_path,text_path,text_chars,page_count FROM decisions LIMIT 1').fetchone()
          assert status=='text_extracted' and chars>1000 and pages==12,(status,chars,pages)
          assert (r/pdf_path).is_file() and (r/txt_path).is_file()
          print('END TO END ARCHIVE VERIFIED:',status,'pages:',pages,'characters:',chars)
          PY

      - name: Download and import real Indo-Law XML with original court URL
        run: |
          python - <<'PY'
          import requests
          url='https://raw.githubusercontent.com/ir-nlp-csui/indo-law/main/dataset/00035681c8d944203f25d2e8215ae2bf.xml'
          r=requests.get(url,timeout=25)
          print('Indo-Law XML HTTP:',r.status_code,'bytes:',len(r.content))
          r.raise_for_status()
          open('real-test.xml','wb').write(r.content)
          PY
          python -m rulings.import_corpus real-test.xml --output smoke-real --source ir-nlp-csui/indo-law
          python -m rulings.archive stats --output smoke-real
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          r=Path('smoke-real')
          con=sqlite3.connect(r/'index.sqlite3')
          row=con.execute("SELECT status, detail_url, text_chars, text_path FROM decisions WHERE status='text_imported' LIMIT 1").fetchone()
          assert row is not None,row
          status,url,chars,path=row
          assert url.endswith('/00035681c8d944203f25d2e8215ae2bf.html')
          assert chars>100 and (r/path).is_file()
          print('REAL XML IMPORT VERIFIED:',status,chars,'characters',url)
          PY
