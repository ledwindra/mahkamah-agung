name: Archive unit tests

on:
  push:
    branches:
      - main
      - feature/decision-pdf-archive
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-archive.txt
      - name: Compile archive module
        run: python -m py_compile rulings/archive.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
